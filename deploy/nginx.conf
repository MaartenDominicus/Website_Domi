server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    # Tunnel traffic reaches this origin over HTTP; retain the public scheme.
    absolute_redirect off;

    # Pages and unversioned files can change at the same URL on each release.
    # Allow storage, but require validation before reuse (ETag/Last-Modified).
    # The versioned /_next/static/ location overrides this with its long TTL.
    expires -1;

    # Match the original request, not an internal directory-index lookup.
    # A URI-based rewrite here would redirect / back to itself indefinitely.
    if ($request_uri ~ "^(?<domi_index_directory>[^?]*)/index\.html(?:\?|$)") {
        return 308 $domi_index_directory/$is_args$args;
    }

    # HTML is included by default; compress text assets, not images or fonts.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # The static origin may receive Via from Cloudflare Tunnel or another proxy.
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml text/xml image/svg+xml;

    include /etc/nginx/legacy-redirects.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # The static site posts only to FormSubmit and uses no base/object elements.
    # Keep script/style loading unchanged, including React's inline hydration.
    add_header Content-Security-Policy "base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action https://formsubmit.co" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        return 404;
    }

    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
